name: CI/CD - WATCHDOG

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test WATCHDOG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run backend tests
        run: pytest

      - name: Run ruff
        run: python -m ruff check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy WATCHDOG
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            cd /opt/apps/mike/WATCHDOG

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing backend dependencies..."
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
            .venv/bin/pip install -e .

            echo "Running database migrations..."
            .venv/bin/python -m alembic upgrade head

            echo "Building frontend..."
            cd frontend

            printf '%s\n' \
              'VITE_API_BASE_URL=/api/v1' \
              'VITE_APP_NAME=WATCHDOG' \
              > .env

            npm ci
            npm run build

            cd ..

            echo "Restarting WATCHDOG..."
            sudo systemctl restart watchdog

            echo "Checking WATCHDOG service..."
            sudo systemctl is-active --quiet watchdog

            echo "Waiting for API /health..."
            for i in 1 2 3 4 5 6; do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
                echo "WATCHDOG is healthy"
                exit 0
              fi
              echo "Waiting for /health (attempt $i/6)..."
              sleep 5
            done
            echo "API did not become healthy after restart"
            sudo journalctl -u watchdog -n 50 --no-pager
            exit 1
