<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>logo fit check</title>
<style>
  body { margin: 0; padding: 24px; background: #ffffff; font-family: Inter, system-ui, sans-serif; }
  .row { display: flex; gap: 24px; align-items: flex-start; }
  .cell { text-align: center; }
  .cell p { margin: 6px 0 0; font-size: 12px; color: #5f6d84; }
  .stage { position: relative; width: 256px; height: 256px; background: #000; }
  .stage img, .stage svg { position: absolute; inset: 0; width: 256px; height: 256px; }
  .stage svg { opacity: 0.55; }
  .plain { background: #000; width: 256px; height: 256px; }
  .plain img { width: 256px; height: 256px; display: block; }
  .plain svg { display: block; background: #000; }
</style>
</head>
<body>
<div class="row">
  <div class="cell">
    <div class="plain"><img src="/mark-512.png" alt="original" /></div>
    <p>original PNG</p>
  </div>
  <div class="cell">
    <div class="plain">
      <svg viewBox="0 0 512 512" width="256" height="256" xmlns="http://www.w3.org/2000/svg"><use href="#mark-v2"/></svg>
    </div>
    <p>SVG recreation</p>
  </div>
  <div class="cell">
    <div class="stage">
      <img src="/mark-512.png" alt="original" />
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><use href="#mark-v2"/></svg>
    </div>
    <p>overlay (SVG 55% over PNG)</p>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark-v2" viewBox="0 0 512 512">
      <path d="M 148 452 L 240 232 Q 256 198 272 232 L 364 452"

      <path fill="#2563eb" d="
        M 395 466

  </defs>
</svg>
</body>
</html>
